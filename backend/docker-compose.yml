services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tallytrail
      POSTGRES_USER: tallytrail
      POSTGRES_PASSWORD: tallytrail
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallytrail -d tallytrail"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["tallytrail_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tallytrail
      MINIO_ROOT_PASSWORD: tallytrail-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["tallytrail_minio:/data"]

volumes:
  tallytrail_postgres:
  tallytrail_minio:
